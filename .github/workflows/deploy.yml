name: CI/CD API

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: boteco12-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  EASYPANEL_PROJECT: f12-prd
  EASYPANEL_SERVICE: api
  EASYPANEL_WORKER_SERVICE: worker-managed
  API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://api.boteco12.com/health' }}

jobs:
  ci:
    name: Build and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Run CI checks
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run ci:check

      - name: Run Mesa discovery PostgreSQL integration
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run test:mesa-discovery:postgres

      - name: Prove backup restore in a disposable database
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          RESTORE_DATABASE_URL: postgresql://ci:ci@localhost:5432/boteco12_restore_ci
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          backup_dir="${RUNNER_TEMP}/boteco12-backup"
          BACKUP_DIR="$backup_dir" npm run db:backup -- --label ci-restore
          backup_file="$(find "$backup_dir" -name '*.dump' -type f -print -quit)"
          manifest_file="${backup_file%.dump}.manifest.json"
          npm run db:backup:verify -- --file "$backup_file" --manifest "$manifest_file"
          psql -h localhost -U ci -d ci -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE boteco12_restore_ci'
          npm run db:restore -- \
            --file "$backup_file" \
            --target-url "$RESTORE_DATABASE_URL" \
            --yes-i-know-this-drops-data
          restored_tables="$(psql "$RESTORE_DATABASE_URL" -Atc \
            "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")"
          test "$restored_tables" -gt 0

      - name: Publish security gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-gates-${{ github.sha }}
          path: .artifacts/security-gates.json
          if-no-files-found: error
          retention-days: 30

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: docker build -t "boteco12-api:${GITHUB_SHA}" .

      - name: Verify container hardening
        run: sh scripts/verify-container-hardening.sh "boteco12-api:${GITHUB_SHA}"

      - name: Scan production image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image \
            --exit-code 1 \
            --ignore-unfixed=false \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            "boteco12-api:${GITHUB_SHA}"

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci, docker-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Block automatic schema migrations
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="HEAD^"
          fi
          if git diff --name-only "$BASE_SHA" HEAD -- prisma/schema.prisma prisma/migrations \
            | grep -q .; then
            echo "Schema changes require the production migration runbook before deploy." >&2
            exit 1
          fi

      - name: Compute expected release version
        run: |
          RELEASE_VERSION="$(node scripts/release-fingerprint.js)"
          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Trigger EasyPanel API and worker deploys
        env:
          EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
          EASYPANEL_EMAIL: ${{ secrets.EASYPANEL_EMAIL }}
          EASYPANEL_PASSWORD: ${{ secrets.EASYPANEL_PASSWORD }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const required = ['EASYPANEL_URL', 'EASYPANEL_EMAIL', 'EASYPANEL_PASSWORD']
          for (const name of required) {
            if (!process.env[name]) throw new Error(`${name} is required`)
          }

          const base = process.env.EASYPANEL_URL.replace(/\/$/, '')

          async function rpc(path, json, token) {
            const response = await fetch(`${base}${path}`, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                ...(token ? { authorization: `Bearer ${token}` } : {}),
              },
              body: JSON.stringify({ json }),
            })

            const text = await response.text()
            let body
            try {
              body = text ? JSON.parse(text) : {}
            } catch {
              body = { raw: text }
            }

            if (!response.ok) {
              throw new Error(`RPC ${path} failed with ${response.status}: ${text}`)
            }

            if (body?.error) {
              const message = body.error?.message || 'unknown application error'
              throw new Error(`RPC ${path} was rejected: ${message}`)
            }

            return body
          }

          const login = await rpc('/api/rpc/auth/login', {
            email: process.env.EASYPANEL_EMAIL,
            password: process.env.EASYPANEL_PASSWORD,
            rememberMe: false,
          })

          const token = login?.json?.token
          if (!token) throw new Error('EasyPanel login did not return a token')

          const inventory = await rpc(
            '/api/rpc/projects/listProjectsAndServices',
            {},
            token
          )
          const services = Object.entries(inventory?.json || {}).flatMap(
            ([collection, items]) => Array.isArray(items)
              ? items.map(item => ({ ...item, collection }))
              : []
          )

          for (const serviceName of [
            process.env.EASYPANEL_SERVICE || 'api',
            process.env.EASYPANEL_WORKER_SERVICE || 'worker-managed',
          ]) {
            const service = services.find(item =>
              item.projectName === (process.env.EASYPANEL_PROJECT || 'f12-prd') &&
              item.name === serviceName
            )
            if (!service) throw new Error(`EasyPanel service ${serviceName} was not found`)

            const serviceDescriptor = `${service.type || ''} ${service.collection || ''}`
            const isCompose = serviceDescriptor.toLowerCase().includes('compose')
            const serviceKind = isCompose ? 'compose' : 'app'
            await rpc(`/api/rpc/services/${serviceKind}/deployService`, {
              projectName: process.env.EASYPANEL_PROJECT || 'f12-prd',
              serviceName,
              ...(isCompose ? { forceRebuild: true } : {}),
            }, token)
            console.log(`EasyPanel deploy requested for ${serviceName} (${serviceKind}).`)
          }

          NODE

      - name: Wait for healthy API
        run: |
          set -euo pipefail
          echo "Waiting for $API_HEALTH_URL to serve release $RELEASE_VERSION"
          for i in $(seq 1 36); do
            HEALTH_RESPONSE="$(curl -fsS --max-time 10 "$API_HEALTH_URL" || true)"
            if printf '%s' "$HEALTH_RESPONSE" | grep -q '"api":"ok"' \
              && printf '%s' "$HEALTH_RESPONSE" | grep -q '"db":"ok"' \
              && printf '%s' "$HEALTH_RESPONSE" | grep -q "\"version\":\"$RELEASE_VERSION\""; then
              echo "API release $RELEASE_VERSION is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for healthy API."
          exit 1
