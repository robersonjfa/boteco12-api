name: Production migration preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate EasyPanel access configuration
        env:
          EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
          EASYPANEL_EMAIL: ${{ secrets.EASYPANEL_EMAIL }}
          EASYPANEL_PASSWORD: ${{ secrets.EASYPANEL_PASSWORD }}
        run: |
          set -eu
          missing=''
          for name in EASYPANEL_URL EASYPANEL_EMAIL EASYPANEL_PASSWORD; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="${missing}${missing:+, }${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing EasyPanel secrets: $missing" >&2
            exit 1
          fi

      - name: Run sanitized read-only production preflight
        env:
          EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
          EASYPANEL_EMAIL: ${{ secrets.EASYPANEL_EMAIL }}
          EASYPANEL_PASSWORD: ${{ secrets.EASYPANEL_PASSWORD }}
          EASYPANEL_PROJECT: f12-prd
          EASYPANEL_API_SERVICE: api
          EASYPANEL_WORKER_SERVICE: worker-managed
        run: node scripts/easypanel-production-preflight.js
